<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Salesforce Integration Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --ink: #1b2430;
      --muted: #5c6b7a;
      --line: #d5dde5;
      --line-strong: #b7c3cf;
      --header: #eef3f8;
      --header-ink: #243140;
      --accent: #0176d3;
      --accent-soft: #e8f4fd;
      --green: #0b6b3a;
      --red: #b42318;
      --shadow: 0 12px 32px rgba(16, 36, 58, 0.16);
      --font: "Inter", sans-serif;
      --row-h: 32px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.25rem 0.85rem;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .meta {
      margin-top: 0.3rem;
      color: var(--muted);
      font-size: 0.82rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.7rem;
      align-items: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0.1rem 0.5rem;
      background: #fff6e5;
      color: #8a5a00;
      font-weight: 600;
      font-size: 0.72rem;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      padding-bottom: 0.15rem;
    }

    button {
      font-family: inherit;
    }

    .text-btn {
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--header-ink);
      border-radius: 6px;
      padding: 0.4rem 0.7rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .text-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .text-btn:not(:disabled):hover { background: var(--accent-soft); }

    #status {
      padding: 0.55rem 1.25rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    #status.error { color: var(--red); background: #fff1f0; }
    #status:empty { display: none; }

    .grid-wrap {
      flex: 1;
      min-height: 0;
      margin: 0.75rem 1rem 1rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: auto;
      position: relative;
    }

    table {
      border-collapse: separate;
      border-spacing: 0;
      min-width: 100%;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 3;
      background: var(--header);
      color: var(--header-ink);
      font-weight: 600;
      text-align: left;
      border-bottom: 1px solid var(--line-strong);
      border-right: 1px solid var(--line);
      height: 38px;
      padding: 0;
      white-space: nowrap;
    }

    .th-inner {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0 0.35rem 0 0.65rem;
      min-width: 148px;
      height: 38px;
    }

    .th-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sort-mark {
      color: var(--accent);
      font-size: 0.72rem;
    }

    .filter-btn {
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #7b8b9a;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .filter-btn:hover,
    .filter-btn.open { background: #d9e6f2; color: var(--header-ink); }
    .filter-btn.active { color: var(--accent); background: var(--accent-soft); }

    tbody td {
      height: var(--row-h);
      max-width: 240px;
      padding: 0 0.65rem;
      border-bottom: 1px solid #e8eef3;
      border-right: 1px solid #f0f4f7;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }

    tbody tr:hover td { background: #f5f9fc; }
    td.num { text-align: right; }
    td.pos { color: var(--green); font-weight: 600; }
    td.neg { color: var(--red); font-weight: 600; }
    td.flag-on { font-weight: 700; color: var(--accent); }
    td.empty { height: auto; max-width: none; }

    .spacer td {
      padding: 0;
      border: 0;
      background: transparent;
    }
    .spacer:hover td { background: transparent; }

    .empty {
      padding: 2.5rem 1rem;
      text-align: center;
      color: var(--muted);
    }

    .popover {
      position: fixed;
      z-index: 20;
      width: 280px;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      max-height: min(460px, calc(100vh - 16px));
    }
    .popover[hidden] { display: none; }

    .pop-sort,
    .pop-clear {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      padding: 0.55rem 0.75rem;
      font-size: 0.82rem;
      cursor: pointer;
      color: var(--ink);
    }
    .pop-sort:hover,
    .pop-clear:hover { background: var(--accent-soft); }
    .pop-clear { color: var(--accent); font-weight: 600; }
    .pop-clear[hidden] { display: none; }
    .pop-rule { height: 1px; background: var(--line); margin: 0; }

    .pop-search-wrap { padding: 0.55rem 0.65rem 0.35rem; }
    .pop-search {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 0.4rem 0.5rem;
      font: inherit;
      font-size: 0.82rem;
    }
    .pop-search:focus {
      outline: 2px solid rgba(1, 118, 211, 0.25);
      border-color: var(--accent);
    }

    .value-list {
      overflow: auto;
      padding: 0.15rem 0.35rem 0.4rem;
      min-height: 80px;
    }

    .value-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.22rem 0.35rem;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .value-row:hover { background: #f3f7fb; }
    .value-row span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pop-note {
      color: var(--muted);
      font-size: 0.72rem;
      padding: 0 0.75rem 0.4rem;
    }

    .pop-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.4rem;
      padding: 0.5rem 0.65rem;
      border-top: 1px solid var(--line);
    }

    .btn-ok, .btn-cancel {
      border-radius: 6px;
      padding: 0.35rem 0.7rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-ok {
      background: var(--accent);
      color: white;
      border: 1px solid var(--accent);
    }
    .btn-cancel {
      background: var(--surface);
      border: 1px solid var(--line-strong);
      color: var(--header-ink);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Salesforce Integration Tracker</h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="header-actions">
        <button class="text-btn" id="clear-filters" type="button" disabled>Reset view</button>
      </div>
    </header>
    <div id="status">Loading…</div>
    <div class="grid-wrap" id="grid">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="popover" id="popover" hidden>
    <button class="pop-sort" type="button" data-dir="asc">Sort A to Z</button>
    <button class="pop-sort" type="button" data-dir="desc">Sort Z to A</button>
    <button class="pop-clear" type="button" id="pop-clear" hidden>Clear filter</button>
    <div class="pop-rule"></div>
    <div class="pop-search-wrap">
      <input class="pop-search" id="pop-search" type="search" placeholder="Search values" autocomplete="off" />
    </div>
    <div class="value-list" id="value-list"></div>
    <div class="pop-note" id="pop-note"></div>
    <div class="pop-actions">
      <button class="btn-cancel" id="pop-cancel" type="button">Cancel</button>
      <button class="btn-ok" id="pop-ok" type="button">OK</button>
    </div>
  </div>

  <script>
    const ROW_H = 32;
    const LIST_CAP = 400;
    const BLANK = "(Blanks)";

    const state = {
      columns: [],
      records: [],
      filtered: [],
      filters: new Map(),
      sort: null,
      demoMode: false,
      generatedAt: null,
      draft: null,
      uniqueCache: new Map(),
    };

    const grid = document.getElementById("grid");
    const thead = document.getElementById("thead");
    const tbody = document.getElementById("tbody");
    const statusEl = document.getElementById("status");
    const metaEl = document.getElementById("meta");
    const clearBtn = document.getElementById("clear-filters");
    const popover = document.getElementById("popover");
    const popSearch = document.getElementById("pop-search");
    const valueList = document.getElementById("value-list");
    const popNote = document.getElementById("pop-note");
    const popClear = document.getElementById("pop-clear");

    function isBlank(value) {
      return value === null || value === undefined || value === "";
    }

    function formatValue(column, value) {
      if (isBlank(value)) return "";
      if (column.type === "id" || column.type === "flag") return String(value);
      if (column.type === "number") {
        const n = Number(value);
        if (!Number.isFinite(n)) return String(value);
        return new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 }).format(n);
      }
      return String(value);
    }

    function filterLabel(column, value) {
      const shown = formatValue(column, value);
      return shown === "" ? BLANK : shown;
    }

    function compareValues(column, a, b, dir) {
      const av = a[column.key];
      const bv = b[column.key];
      const aBlank = isBlank(av);
      const bBlank = isBlank(bv);
      if (aBlank && bBlank) return 0;
      if (aBlank) return 1;
      if (bBlank) return -1;
      let cmp = 0;
      if (column.type === "number" || column.type === "flag" || column.type === "id") {
        cmp = Number(av) - Number(bv);
      } else {
        cmp = String(av).localeCompare(String(bv), undefined, { numeric: true, sensitivity: "base" });
      }
      return dir === "desc" ? -cmp : cmp;
    }

    function columnByKey(key) {
      return state.columns.find((col) => col.key === key);
    }

    function uniqueEntries(column) {
      if (state.uniqueCache.has(column.key)) return state.uniqueCache.get(column.key);
      const seen = new Map();
      for (const row of state.records) {
        const label = filterLabel(column, row[column.key]);
        if (!seen.has(label)) seen.set(label, row[column.key]);
      }
      const entries = Array.from(seen, ([label, raw]) => ({ label, raw }));
      entries.sort((a, b) => {
        if (a.label === BLANK) return 1;
        if (b.label === BLANK) return -1;
        return compareValues(column, { [column.key]: a.raw }, { [column.key]: b.raw }, "asc");
      });
      state.uniqueCache.set(column.key, entries);
      return entries;
    }

    function applyView() {
      let rows = state.records;
      if (state.filters.size) {
        rows = rows.filter((row) => {
          for (const [key, allowed] of state.filters) {
            const column = columnByKey(key);
            if (!allowed.has(filterLabel(column, row[key]))) return false;
          }
          return true;
        });
      }
      if (state.sort) {
        const column = columnByKey(state.sort.key);
        const dir = state.sort.dir;
        rows = rows.slice().sort((a, b) => compareValues(column, a, b, dir));
      }
      state.filtered = rows;
      clearBtn.disabled = state.filters.size === 0 && !state.sort;
      renderMeta();
      renderBody();
    }

    function renderMeta() {
      metaEl.replaceChildren();
      const shown = state.filtered.length;
      const total = state.records.length;
      const count = document.createElement("span");
      count.textContent =
        shown === total
          ? `${shown.toLocaleString("en-US")} rows`
          : `${shown.toLocaleString("en-US")} of ${total.toLocaleString("en-US")} rows`;
      metaEl.appendChild(count);
      if (state.generatedAt) {
        const when = document.createElement("span");
        const formatted = new Intl.DateTimeFormat("en-GB", {
          dateStyle: "medium",
          timeStyle: "short",
        }).format(new Date(state.generatedAt));
        when.textContent = `Updated ${formatted}`;
        metaEl.appendChild(when);
      }
      if (state.demoMode) {
        const pill = document.createElement("span");
        pill.className = "pill";
        pill.textContent = "Sample data";
        metaEl.appendChild(pill);
      }
    }

    function renderHead() {
      const tr = document.createElement("tr");
      for (const column of state.columns) {
        const th = document.createElement("th");
        const inner = document.createElement("div");
        inner.className = "th-inner";
        const label = document.createElement("span");
        label.className = "th-label";
        label.textContent = column.label;
        label.title = column.label;
        inner.appendChild(label);
        if (state.sort && state.sort.key === column.key) {
          const mark = document.createElement("span");
          mark.className = "sort-mark";
          mark.textContent = state.sort.dir === "asc" ? "↑" : "↓";
          inner.appendChild(mark);
        }
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "filter-btn";
        if (state.filters.has(column.key)) btn.classList.add("active");
        btn.setAttribute("aria-label", `Filter ${column.label}`);
        btn.dataset.key = column.key;
        btn.innerHTML =
          '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16l-6 7v6l-4 2v-8L4 5z"/></svg>';
        btn.addEventListener("click", (event) => {
          event.stopPropagation();
          togglePopover(column.key, btn);
        });
        inner.appendChild(btn);
        th.appendChild(inner);
        tr.appendChild(th);
      }
      thead.replaceChildren(tr);
    }

    function cellClass(column, value) {
      const classes = [];
      if (column.type === "number" || column.type === "flag" || column.type === "id") classes.push("num");
      if (column.type === "flag" && Number(value) === 1) classes.push("flag-on");
      if (column.key.endsWith("_difference") && !isBlank(value)) {
        if (Number(value) > 0) classes.push("pos");
        else if (Number(value) < 0) classes.push("neg");
      }
      return classes.join(" ");
    }

    function renderBody() {
      const columns = state.columns;
      const rows = state.filtered;
      if (!rows.length) {
        tbody.replaceChildren();
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = Math.max(columns.length, 1);
        td.className = "empty";
        td.textContent = state.records.length
          ? "No rows match the current filters."
          : "No change rows returned.";
        tr.appendChild(td);
        tbody.appendChild(tr);
        return;
      }

      const scrollTop = grid.scrollTop;
      const viewH = grid.clientHeight || 600;
      const start = Math.max(0, Math.floor(scrollTop / ROW_H) - 8);
      const end = Math.min(rows.length, Math.ceil((scrollTop + viewH) / ROW_H) + 8);
      const frag = document.createDocumentFragment();

      const top = document.createElement("tr");
      top.className = "spacer";
      const topTd = document.createElement("td");
      topTd.colSpan = columns.length;
      topTd.style.height = `${start * ROW_H}px`;
      top.appendChild(topTd);
      frag.appendChild(top);

      for (let i = start; i < end; i += 1) {
        const row = rows[i];
        const tr = document.createElement("tr");
        for (const column of columns) {
          const td = document.createElement("td");
          const text = formatValue(column, row[column.key]);
          td.textContent = text;
          td.className = cellClass(column, row[column.key]);
          if (text) td.title = text;
          tr.appendChild(td);
        }
        frag.appendChild(tr);
      }

      const bottom = document.createElement("tr");
      bottom.className = "spacer";
      const bottomTd = document.createElement("td");
      bottomTd.colSpan = columns.length;
      bottomTd.style.height = `${(rows.length - end) * ROW_H}px`;
      bottom.appendChild(bottomTd);
      frag.appendChild(bottom);
      tbody.replaceChildren(frag);
    }

    let scrollQueued = false;
    grid.addEventListener("scroll", () => {
      if (scrollQueued) return;
      scrollQueued = true;
      requestAnimationFrame(() => {
        scrollQueued = false;
        if (!popover.hidden) closePopover(false);
        renderBody();
      });
    });

    function renderList() {
      const column = columnByKey(state.draft.key);
      const query = popSearch.value.trim().toLowerCase();
      const entries = uniqueEntries(column).filter((entry) =>
        entry.label.toLowerCase().includes(query)
      );
      const shown = entries.slice(0, LIST_CAP);
      const scroll = valueList.scrollTop;
      valueList.replaceChildren();

      const allRow = document.createElement("label");
      allRow.className = "value-row";
      const allBox = document.createElement("input");
      allBox.type = "checkbox";
      const selectedShown = entries.filter((entry) => state.draft.selected.has(entry.label)).length;
      allBox.checked = entries.length > 0 && selectedShown === entries.length;
      allBox.indeterminate = selectedShown > 0 && selectedShown < entries.length;
      allBox.addEventListener("change", () => {
        for (const entry of entries) {
          if (allBox.checked) state.draft.selected.add(entry.label);
          else state.draft.selected.delete(entry.label);
        }
        renderList();
      });
      const allLabel = document.createElement("span");
      allLabel.textContent = "Select all";
      allRow.append(allBox, allLabel);
      valueList.appendChild(allRow);

      for (const entry of shown) {
        const row = document.createElement("label");
        row.className = "value-row";
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = state.draft.selected.has(entry.label);
        box.addEventListener("change", () => {
          if (box.checked) state.draft.selected.add(entry.label);
          else state.draft.selected.delete(entry.label);
          renderList();
        });
        const span = document.createElement("span");
        span.textContent = entry.label;
        span.title = entry.label;
        row.append(box, span);
        valueList.appendChild(row);
      }

      const hidden = entries.length - shown.length;
      popNote.textContent = hidden > 0
        ? `Showing ${shown.length.toLocaleString("en-US")} of ${entries.length.toLocaleString("en-US")}. Search to narrow.`
        : `${entries.length.toLocaleString("en-US")} values`;
      valueList.scrollTop = scroll;
    }

    function positionPopover(anchor) {
      const rect = anchor.getBoundingClientRect();
      popover.hidden = false;
      const width = popover.offsetWidth;
      const height = popover.offsetHeight;
      let left = rect.right - width;
      let top = rect.bottom + 6;
      if (left < 8) left = 8;
      if (left + width > window.innerWidth - 8) left = window.innerWidth - width - 8;
      if (top + height > window.innerHeight - 8) top = Math.max(8, rect.top - height - 6);
      popover.style.left = `${left}px`;
      popover.style.top = `${top}px`;
    }

    function closePopover(apply) {
      if (!state.draft) {
        popover.hidden = true;
        return;
      }
      if (apply) {
        const column = columnByKey(state.draft.key);
        const all = uniqueEntries(column);
        if (state.draft.selected.size === all.length) state.filters.delete(column.key);
        else state.filters.set(column.key, new Set(state.draft.selected));
      }
      state.draft = null;
      popover.hidden = true;
      document.querySelectorAll(".filter-btn.open").forEach((btn) => btn.classList.remove("open"));
      if (apply) {
        grid.scrollTop = 0;
        renderHead();
        applyView();
      }
    }

    function togglePopover(key, anchor) {
      if (state.draft && state.draft.key === key) {
        closePopover(false);
        return;
      }
      closePopover(false);
      const column = columnByKey(key);
      const entries = uniqueEntries(column);
      const existing = state.filters.get(key);
      const selected = new Set(existing || entries.map((entry) => entry.label));
      state.draft = { key, selected };
      popSearch.value = "";
      popClear.hidden = !state.filters.has(key);
      anchor.classList.add("open");
      renderList();
      positionPopover(anchor);
      popSearch.focus();
    }

    popSearch.addEventListener("input", renderList);
    document.getElementById("pop-ok").addEventListener("click", () => closePopover(true));
    document.getElementById("pop-cancel").addEventListener("click", () => closePopover(false));
    popClear.addEventListener("click", () => {
      if (!state.draft) return;
      state.filters.delete(state.draft.key);
      state.draft = null;
      popover.hidden = true;
      grid.scrollTop = 0;
      renderHead();
      applyView();
    });
    popover.querySelectorAll(".pop-sort").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (!state.draft) return;
        state.sort = { key: state.draft.key, dir: btn.dataset.dir };
        state.draft = null;
        popover.hidden = true;
        grid.scrollTop = 0;
        renderHead();
        applyView();
      });
    });

    document.addEventListener("mousedown", (event) => {
      if (popover.hidden) return;
      if (popover.contains(event.target)) return;
      if (event.target.closest(".filter-btn")) return;
      closePopover(false);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !popover.hidden) closePopover(false);
    });
    window.addEventListener("resize", () => {
      if (!popover.hidden) closePopover(false);
      renderBody();
    });

    clearBtn.addEventListener("click", () => {
      state.filters.clear();
      state.sort = null;
      closePopover(false);
      grid.scrollTop = 0;
      renderHead();
      applyView();
    });

    function setStatus(message, isError) {
      statusEl.textContent = message || "";
      statusEl.classList.toggle("error", Boolean(isError));
    }

    async function load() {
      setStatus("Loading…", false);
      try {
        const res = await fetch("/api/data", { headers: { Accept: "application/json" } });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || "Failed to load dashboard data.");
        state.columns = Array.isArray(body.columns) ? body.columns : [];
        state.records = Array.isArray(body.records) ? body.records : [];
        state.demoMode = Boolean(body.demoMode);
        state.generatedAt = body.generatedAt || null;
        state.filters.clear();
        state.sort = null;
        state.uniqueCache.clear();
        setStatus("", false);
        renderHead();
        applyView();
      } catch (err) {
        setStatus(err.message || "Failed to load dashboard data.", true);
      }
    }

    load();
  </script>
</body>
</html>
