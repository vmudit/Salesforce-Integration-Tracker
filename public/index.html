<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trial Extension Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #111827;
      --surface-2: #0f172a;
      --fg: #e2e8f0;
      --fg-strong: #f8fafc;
      --muted: #64748b;
      --muted-2: #94a3b8;
      --line: #1e293b;
      --line-2: #334155;
      --accent: #6366f1;
      --accent-soft: rgba(99, 102, 241, 0.14);
      --green: #4ade80;
      --teal: #2dd4bf;
      --orange: #fb923c;
      --red: #f87171;
      --blue: #60a5fa;
      --pink: #f472b6;
      --yellow: #eab308;
      --radius: 12px;
      --font: "Inter", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      height: 100%;
      overflow: hidden;
    }

    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0.75rem 1.25rem 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .dashboard-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.45rem;
      flex-shrink: 0;
    }
    .dashboard-title {
      margin: 0;
      grid-column: 2;
      justify-self: center;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--fg-strong);
      letter-spacing: -0.02em;
      text-align: center;
    }
    .header-actions {
      grid-column: 3;
      justify-self: end;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      padding-right: 1rem;
    }
    @media (max-width: 700px) {
      .dashboard-header {
        grid-template-columns: 1fr;
        justify-items: center;
      }
      .dashboard-title { grid-column: 1; }
      .header-actions { grid-column: 1; justify-self: center; }
    }

    #status {
      margin-bottom: 1rem;
      color: var(--muted-2);
      font-size: 0.88rem;
      flex-shrink: 0;
    }
    #status:empty,
    #status[hidden] { display: none; }
    #status.error { color: var(--red); }

    #filters-panel {
      flex-shrink: 0;
      z-index: 20;
      margin-bottom: 0.75rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      overflow: visible;
    }

    .scroll-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding-bottom: 2rem;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    @media (min-width: 1100px) {
      .kpis { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    }
    @media (max-width: 700px) {
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      min-height: 5.35rem;
      box-sizing: border-box;
    }
    .kpi-label {
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }
    .kpi-value {
      font-size: 1.55rem;
      font-weight: 700;
      line-height: 1.1;
      color: var(--fg-strong);
      font-variant-numeric: tabular-nums;
    }
    .kpi-value.teal { color: var(--teal); }
    .kpi-value.green { color: var(--green); }
    .kpi-value.orange { color: var(--orange); }
    .kpi-value.blue { color: var(--blue); }
    .kpi-value.pink { color: var(--pink); }
    .kpi-value.yellow { color: var(--yellow); }
    .kpi-sub {
      color: var(--muted);
      font-size: 0.72rem;
      margin-top: 0.25rem;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      margin-bottom: 1rem;
      overflow: hidden;
    }
    .panel-h {
      padding: 0.75rem 1rem 0.55rem;
      border-bottom: 1px solid var(--line);
    }
    #filters-panel .panel-h {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-top: 0.45rem;
    }
    .panel-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f1f5f9;
      margin: 0;
    }
    .panel-subtitle {
      color: var(--muted);
      font-size: 0.75rem;
      margin: 0.15rem 0 0;
    }
    .panel-b { padding: 0.75rem 1rem; }

    .filters {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .filters-row {
      display: grid;
      gap: 0.5rem 0.65rem;
      align-items: end;
    }
    .filters-row-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .filters-row-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    @media (max-width: 1100px) {
      .filters-row-5,
      .filters-row-4 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 900px) {
      .filters-row-5,
      .filters-row-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .filters-row-5,
      .filters-row-4 { grid-template-columns: 1fr 1fr; }
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .filters label {
      min-width: 0;
      gap: 0.22rem;
      font-size: 0.62rem;
    }
    .filters input,
    .filters select {
      width: 100%;
      min-width: 0;
      font-size: 0.74rem;
      padding: 0.22rem 0.45rem;
      min-height: 2rem;
      height: 2rem;
      border-radius: 8px;
    }
    .filters input[type="date"] {
      font-size: 0.7rem;
      padding: 0.18rem 0.45rem;
    }
    .ms {
      position: relative;
    }
    .ms-toggle {
      width: 100%;
      height: 2rem;
      min-height: 2rem;
      padding: 0.22rem 0.45rem;
      font-size: 0.74rem;
      font-weight: 600;
      text-align: left;
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--fg);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ms-toggle:hover {
      background: #1e293b;
      color: var(--fg);
    }
    .ms-menu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      z-index: 40;
      background: #0f172a;
      border: 1px solid var(--line-2);
      border-radius: 8px;
      padding: 0.3rem;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    }
    .ms-option {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0.4rem;
      padding: 0.28rem 0.4rem;
      margin: 0;
      font-size: 0.74rem;
      font-weight: 500;
      text-transform: none;
      letter-spacing: normal;
      color: var(--fg);
      border-radius: 6px;
      cursor: pointer;
    }
    .ms-option:hover { background: #1e293b; }
    .ms-option input {
      width: auto;
      min-width: 0;
      height: auto;
      min-height: 0;
      margin: 0;
      padding: 0;
      accent-color: var(--accent);
    }
    input, select {
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: none;
      letter-spacing: normal;
      color: var(--fg);
      background: var(--surface-2);
      border: 1px solid var(--line-2);
      border-radius: 10px;
      padding: 0.5rem 0.65rem;
      min-height: 2.5rem;
    }
    input[type="date"] {
      color-scheme: dark;
      background: var(--accent-soft);
      border-color: rgba(99, 102, 241, 0.42);
      color: #a5b4fc;
      border-radius: 999px;
      font-size: 0.78rem;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }
    button {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 10px;
      border: 1px solid var(--line-2);
      background: var(--surface);
      color: var(--muted-2);
      padding: 0 0.85rem;
      height: 2.5rem;
      cursor: pointer;
    }
    button:hover {
      background: #1e293b;
      border-color: var(--accent);
      color: var(--fg);
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover {
      background: #4f46e5;
      border-color: #4f46e5;
      color: #fff;
    }
    .btn-quiet {
      width: 4.75rem;
      height: 1.75rem;
      padding: 0;
      font-size: 0.7rem;
      font-weight: 500;
      background: transparent;
      border: 1px solid rgba(74, 222, 128, 0.28);
      color: rgba(74, 222, 128, 0.72);
      border-radius: 8px;
      text-align: center;
    }
    .btn-quiet:hover {
      background: rgba(74, 222, 128, 0.08);
      border-color: rgba(74, 222, 128, 0.45);
      color: var(--green);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      color: var(--muted-2);
      font-size: 0.85rem;
    }
    .pager {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
    }
    .pager button {
      height: 2.1rem;
      padding: 0 0.7rem;
      font-size: 0.78rem;
    }
    .pager button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #page-info {
      min-width: 7.5rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
    }
    #f-page-size {
      width: auto;
      min-width: 7.5rem;
      height: 2.1rem;
    }
    .search {
      min-width: min(280px, 100%);
      background: var(--surface-2);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
    }
    #table-panel {
      overflow: visible;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      white-space: nowrap;
    }
    th, td {
      text-align: left;
      padding: 0.6rem 0.65rem;
      border-bottom: 1px solid #151f32;
      vertical-align: top;
    }
    th {
      position: sticky;
      top: 0;
      background: #0f172a;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      z-index: 1;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid var(--line);
    }
    th:hover { color: #a5b4fc; }
    th .sort { opacity: 0.45; margin-left: 0.2rem; }
    tbody tr:hover td { background: rgba(255, 255, 255, 0.02); }
    td.num {
      font-variant-numeric: tabular-nums;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: #cbd5e1;
    }
    td.muted { color: var(--muted); }

    .pill {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .pill.ongoing { background: rgba(96, 165, 250, 0.15); color: var(--blue); }
    .pill.expired { background: rgba(148, 163, 184, 0.12); color: #94a3b8; }
    .pill.converted { background: rgba(34, 197, 94, 0.15); color: var(--green); }
    .pill.cancelled { background: rgba(248, 113, 113, 0.15); color: var(--red); }
    .pill.yes { background: rgba(99, 102, 241, 0.18); color: #a5b4fc; }
    .pill.no { background: rgba(148, 163, 184, 0.1); color: #94a3b8; }
    .pill.enterprise { background: rgba(99, 102, 241, 0.18); color: #a5b4fc; }
    .pill.standard { background: rgba(45, 212, 191, 0.15); color: var(--teal); }

    .notes {
      margin-top: 0.85rem;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .notes summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--muted-2);
    }
    .notes ul { margin: 0.5rem 0 0; padding-left: 1.1rem; }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0 0 1rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--line);
    }
    .tab-btn {
      background: var(--surface);
      border: 1px solid var(--line-2);
      color: var(--muted-2);
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      height: 2.35rem;
      padding: 0 1.1rem;
    }
    .tab-btn:hover {
      color: var(--fg);
      border-color: var(--accent);
      background: #1e293b;
    }
    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .subtabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 0.85rem;
    }
    .subtab-btn {
      background: #0f172a;
      border: 1px solid var(--line-2);
      color: var(--muted-2);
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      height: 2.1rem;
      padding: 0 0.9rem;
    }
    .subtab-btn:hover {
      color: var(--fg);
      border-color: var(--accent);
    }
    .subtab-btn.active {
      background: rgba(99, 102, 241, 0.22);
      border-color: var(--accent);
      color: #c7d2fe;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="dashboard-header">
      <h1 class="dashboard-title">Trial Extension Dashboard</h1>
      <div class="header-actions">
        <button type="button" class="btn-quiet" id="btn-refresh" title="Force refresh from source">Refresh</button>
      </div>
    </header>

    <div id="status">Loading…</div>

    <section class="panel" id="filters-panel" hidden>
      <div class="panel-h">
        <div class="panel-title">Filters</div>
        <button type="button" class="btn-quiet" id="btn-reset">Reset</button>
      </div>
      <div class="panel-b">
        <div class="filters">
          <div class="filters-row filters-row-5">
          <label>Date level
            <select id="f-date-level">
              <option value="day">Day</option>
              <option value="week">Week</option>
              <option value="month">Month</option>
              <option value="year">Year</option>
            </select>
          </label>
          <label>
            <span id="lbl-start-from-text">Trial start from</span>
            <input type="date" id="f-start-from" />
          </label>
          <label>
            <span id="lbl-start-to-text">Trial start to</span>
            <input type="date" id="f-start-to" />
          </label>
          <label>Trial type
            <select id="f-type"><option value="">All</option></select>
          </label>
          <label>AE name
            <select id="f-ae"><option value="">All</option></select>
          </label>
          </div>
          <div class="filters-row filters-row-4">
          <label>Trial status
            <div class="ms" id="f-status">
              <button type="button" class="ms-toggle" id="f-status-toggle">All</button>
              <div class="ms-menu" id="f-status-menu" hidden></div>
            </div>
          </label>
          <label>Extended
            <select id="f-extended">
              <option value="">All</option>
              <option value="Yes">Extended (&gt;14 days)</option>
              <option value="No">Not extended (14 days)</option>
            </select>
          </label>
          <label>Limit type
            <select id="f-limit-type">
              <option value="">All</option>
              <option value="Default">Default</option>
              <option value="Custom">Custom</option>
            </select>
          </label>
          <label>Contract customer
            <select id="f-contract">
              <option value="">All</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </label>
          </div>
        </div>
      </div>
    </section>

    <div class="scroll-body">
    <section class="kpis" id="kpis" hidden></section>

    <section class="panel" id="table-panel" hidden>
      <div class="panel-h">
        <div class="panel-title">Trials</div>
        <div class="panel-subtitle">One row per company — multiple emails on the same company ID are collapsed</div>
      </div>
      <div class="panel-b">
        <div class="tabs" role="tablist">
          <button type="button" class="tab-btn active" data-main-tab="summary">Summary</button>
          <button type="button" class="tab-btn" data-main-tab="detailed">Detailed breakdown</button>
        </div>

        <div class="toolbar">
          <span id="row-count"></span>
          <div class="pager">
            <button type="button" id="btn-prev">Prev</button>
            <span id="page-info"></span>
            <button type="button" id="btn-next">Next</button>
            <select id="f-page-size" aria-label="Rows per page">
              <option value="50">50 / page</option>
              <option value="100" selected>100 / page</option>
              <option value="250">250 / page</option>
            </select>
          </div>
          <input class="search" type="search" id="f-search" placeholder="Search account, UID, AE…" />
        </div>

        <div class="tab-panel active" id="panel-summary">
          <div class="table-wrap">
            <table>
              <thead id="thead-summary"></thead>
              <tbody id="tbody-summary"></tbody>
            </table>
          </div>
        </div>

        <div class="tab-panel" id="panel-detailed">
          <div class="subtabs" role="tablist">
            <button type="button" class="subtab-btn active" data-detail-tab="account">Account details</button>
            <button type="button" class="subtab-btn" data-detail-tab="duration">Trial duration</button>
            <button type="button" class="subtab-btn" data-detail-tab="limits">Trial limits</button>
            <button type="button" class="subtab-btn" data-detail-tab="conversion">Conversion details</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead id="thead-detailed"></thead>
              <tbody id="tbody-detailed"></tbody>
            </table>
          </div>
        </div>

        <details class="notes">
          <summary>Field mapping notes</summary>
          <div id="field-notes"></div>
        </details>
      </div>
    </section>
    </div>
  </div>

  <script>
    const SUMMARY_COLUMNS = [
      { key: "accountUid", label: "Company ID" },
      { key: "companyName", label: "Company name" },
      { key: "email", label: "Email" },
      { key: "planSelected", label: "Plan selected", render: "type" },
      { key: "trialStartDate", label: "Trial start date" },
      { key: "currentTrialEndDate", label: "Trial end date" },
      { key: "currentTotalTrialDurationDays", label: "Total trial days", render: "num" },
      { key: "extendedDaysBeyond14", label: "Extended days", render: "num" },
      { key: "extensionDate", label: "Extended on date" },
      { key: "currentTrialStatus", label: "Status", render: "status" },
      { key: "closedWonDate", label: "Customer time" },
      { key: "daysTrialToClosedWon", label: "Trial to customer days", render: "num" },
      { key: "mrrGenerated", label: "MRR", render: "money" },
      { key: "aeName", label: "AE name" },
      { key: "contractCustomer", label: "Contract customer", render: "yn" },
    ];

    const DETAIL_COLUMNS = {
      account: [
        { key: "accountName", label: "Account name" },
        { key: "accountUid", label: "Account UID" },
        { key: "trialType", label: "Trial type", render: "type" },
        { key: "trialSegment", label: "Trial segment" },
        { key: "aeName", label: "AE name" },
        { key: "contractCustomer", label: "Contract customer", render: "yn" },
      ],
      duration: [
        { key: "accountUid", label: "Account UID" },
        { key: "trialStartDate", label: "Trial start date" },
        { key: "originalTrialEndDate", label: "Original trial end date" },
        { key: "originalTrialDurationDays", label: "Original trial duration (days)", render: "num" },
        { key: "trialExtended", label: "Trial extended", render: "yn" },
        { key: "extensionDate", label: "Extended on date" },
        { key: "extendedTrialEndDate", label: "Extended trial end date" },
        { key: "additionalDaysProvided", label: "Additional days provided", render: "num" },
        { key: "currentTotalTrialDurationDays", label: "Current total trial duration", render: "num" },
        { key: "currentTrialStatus", label: "Current trial status", render: "status" },
      ],
      limits: [
        { key: "accountUid", label: "Account UID" },
        { key: "usageLimitApplied", label: "Usage limit applied", render: "limit" },
        { key: "limitType", label: "Limit type" },
        { key: "limitOverridden", label: "Limit overridden", render: "yn" },
        { key: "limitOverrideDate", label: "Date of limit override" },
      ],
      conversion: [
        { key: "accountUid", label: "Account UID" },
        { key: "convertedToPaid", label: "Converted to paid", render: "yn" },
        { key: "closedWonDate", label: "Closed-won date" },
        { key: "mrrGenerated", label: "MRR generated", render: "money" },
        { key: "daysTrialToClosedWon", label: "Days from trial start to closed-won", render: "num" },
        { key: "aeConversionOwner", label: "AE name (conversion)" },
      ],
    };

    let DATA = null;
    let sortKey = "trialStartDate";
    let sortDir = "desc";
    let mainTab = "summary";
    let detailTab = "account";
    let page = 1;
    let pageSize = 100;
    let filteredCache = null;
    let filterCacheKey = "";
    let searchTimer = null;
    let selectedStatuses = new Set();

    function activeColumns() {
      if (mainTab === "summary") return SUMMARY_COLUMNS;
      return DETAIL_COLUMNS[detailTab] || DETAIL_COLUMNS.account;
    }

    function money(n) {
      if (n == null || n === "") return "—";
      return Number(n).toLocaleString(undefined, { style: "currency", currency: "USD", maximumFractionDigits: 0 });
    }

    function escapeHtml(v) {
      return String(v ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function pill(text, cls) {
      return `<span class="pill ${cls}">${escapeHtml(text)}</span>`;
    }

    function cell(col, row) {
      let v = row[col.key];
      if (col.key === "planSelected") {
        const cls = String(row.trialType || v || "").toLowerCase().includes("enterprise")
          ? "enterprise"
          : "standard";
        return `<td>${pill(v || "—", cls)}</td>`;
      }
      if (col.render === "status") {
        const cls = String(v || "").toLowerCase();
        return `<td>${pill(v || "—", cls)}</td>`;
      }
      if (col.render === "type") {
        const cls = String(v || "").toLowerCase();
        return `<td>${pill(v || "—", cls)}</td>`;
      }
      if (col.render === "yn") {
        return `<td>${pill(v || "No", v === "Yes" ? "yes" : "no")}</td>`;
      }
      if (col.render === "money") {
        return `<td class="num">${escapeHtml(v ? money(v) : "—")}</td>`;
      }
      if (col.render === "limit") {
        if (v == null || v === "") return `<td class="muted">—</td>`;
        if (String(v).toLowerCase() === "unlimited") {
          return `<td>${pill("Unlimited", "yes")}</td>`;
        }
        return `<td class="num">${escapeHtml(v)}</td>`;
      }
      if (col.render === "num") {
        return `<td class="num">${v == null || v === "" ? "—" : escapeHtml(v)}</td>`;
      }
      if (v == null || v === "") return `<td class="muted">—</td>`;
      return `<td>${escapeHtml(v)}</td>`;
    }

    function fillSelect(id, values) {
      const el = document.getElementById(id);
      const keep = el.value;
      el.innerHTML = '<option value="">All</option>' +
        values.map((v) => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
      if ([...el.options].some((o) => o.value === keep)) el.value = keep;
    }

    function statusToggleLabel() {
      if (!selectedStatuses.size) return "All";
      return [...selectedStatuses].join(", ");
    }

    function syncStatusToggle() {
      document.getElementById("f-status-toggle").textContent = statusToggleLabel();
    }

    function fillStatusMulti(values) {
      const menu = document.getElementById("f-status-menu");
      selectedStatuses = new Set([...selectedStatuses].filter((v) => values.includes(v)));
      menu.innerHTML = values.map((v) => `
        <label class="ms-option">
          <input type="checkbox" value="${escapeHtml(v)}" ${selectedStatuses.has(v) ? "checked" : ""} />
          ${escapeHtml(v)}
        </label>
      `).join("");
      menu.querySelectorAll("input").forEach((input) => {
        input.addEventListener("change", () => {
          if (input.checked) selectedStatuses.add(input.value);
          else selectedStatuses.delete(input.value);
          syncStatusToggle();
          onFilterChange();
        });
      });
      syncStatusToggle();
    }

    function resetStatusMulti() {
      selectedStatuses = new Set();
      document.querySelectorAll("#f-status-menu input").forEach((input) => {
        input.checked = false;
      });
      syncStatusToggle();
    }

    function renderKpis(summary) {
      const items = [
        { label: "Trials started", value: summary.totalTrialsStarted, color: "" },
        { label: "Ongoing", value: summary.ongoingTrials, color: "blue" },
        { label: "Extended", value: summary.trialsExtended, color: "orange" },
        { label: "Converted", value: summary.trialsConverted, color: "green" },
        { label: "Conversion rate", value: `${summary.trialToPaidConversionRate}%`, color: "teal" },
        { label: "Total MRR", value: money(summary.totalMrrGenerated), color: "pink" },
        { label: "Avg original duration", value: `${summary.avgOriginalTrialDurationDays}d`, color: "yellow" },
        { label: "Avg final duration", value: `${summary.avgFinalTrialDurationDays}d`, color: "" },
        { label: "Avg days to conversion", value: `${summary.avgDaysTrialToConversion}d`, color: "blue" },
      ];
      const root = document.getElementById("kpis");
      root.hidden = false;
      root.innerHTML = items.map((i) => `
        <div class="kpi-card">
          <div class="kpi-label">${escapeHtml(i.label)}</div>
          <div class="kpi-value ${escapeHtml(i.color)}">${escapeHtml(i.value)}</div>
        </div>
      `).join("");
    }

    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function isoDate(d) {
      return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`;
    }

    function periodToRange(level, value, bound) {
      if (!value) return null;
      if (level === "day") return value;

      if (level === "week") {
        const m = /^(\d{4})-W(\d{2})$/.exec(value);
        if (!m) return null;
        const year = Number(m[1]);
        const week = Number(m[2]);
        const jan4 = new Date(Date.UTC(year, 0, 4));
        const day = jan4.getUTCDay() || 7;
        const monday = new Date(jan4);
        monday.setUTCDate(jan4.getUTCDate() - day + 1 + (week - 1) * 7);
        const sunday = new Date(monday);
        sunday.setUTCDate(monday.getUTCDate() + 6);
        return bound === "from" ? isoDate(monday) : isoDate(sunday);
      }

      if (level === "month") {
        const m = /^(\d{4})-(\d{2})$/.exec(value);
        if (!m) return null;
        const year = Number(m[1]);
        const month = Number(m[2]);
        if (bound === "from") return `${year}-${pad2(month)}-01`;
        const last = new Date(Date.UTC(year, month, 0));
        return isoDate(last);
      }

      if (level === "year") {
        const year = Number(value);
        if (!Number.isFinite(year)) return null;
        return bound === "from" ? `${year}-01-01` : `${year}-12-31`;
      }
      return null;
    }

    function syncDateLevelInputs() {
      const level = document.getElementById("f-date-level").value;
      const fromEl = document.getElementById("f-start-from");
      const toEl = document.getElementById("f-start-to");

      const configs = {
        day: { type: "date", fromLabel: "Trial start from", toLabel: "Trial start to" },
        week: { type: "week", fromLabel: "Week from", toLabel: "Week to" },
        month: { type: "month", fromLabel: "Month from", toLabel: "Month to" },
        year: { type: "number", fromLabel: "Year from", toLabel: "Year to" },
      };
      const cfg = configs[level] || configs.day;

      fromEl.type = cfg.type;
      toEl.type = cfg.type;
      fromEl.value = "";
      toEl.value = "";

      if (level === "year") {
        fromEl.min = "2000";
        fromEl.max = "2100";
        fromEl.placeholder = "YYYY";
        fromEl.step = "1";
        toEl.min = "2000";
        toEl.max = "2100";
        toEl.placeholder = "YYYY";
        toEl.step = "1";
      } else {
        fromEl.removeAttribute("min");
        fromEl.removeAttribute("max");
        fromEl.removeAttribute("placeholder");
        fromEl.removeAttribute("step");
        toEl.removeAttribute("min");
        toEl.removeAttribute("max");
        toEl.removeAttribute("placeholder");
        toEl.removeAttribute("step");
      }

      document.getElementById("lbl-start-from-text").textContent = cfg.fromLabel;
      document.getElementById("lbl-start-to-text").textContent = cfg.toLabel;
    }

    function currentFilterKey() {
      return [
        document.getElementById("f-date-level").value,
        document.getElementById("f-start-from").value,
        document.getElementById("f-start-to").value,
        document.getElementById("f-type").value,
        [...selectedStatuses].join(","),
        document.getElementById("f-extended").value,
        document.getElementById("f-limit-type").value,
        document.getElementById("f-ae").value,
        document.getElementById("f-contract").value,
        document.getElementById("f-search").value.trim().toLowerCase(),
        sortKey,
        sortDir,
      ].join("|");
    }

    function filteredRecords() {
      const key = currentFilterKey();
      if (filteredCache && filterCacheKey === key) return filteredCache;

      const level = document.getElementById("f-date-level").value || "day";
      const fromRaw = document.getElementById("f-start-from").value;
      const toRaw = document.getElementById("f-start-to").value;
      const from = periodToRange(level, fromRaw, "from");
      const to = periodToRange(level, toRaw, "to");
      const type = document.getElementById("f-type").value;
      const statuses = [...selectedStatuses];
      const extended = document.getElementById("f-extended").value;
      const limitType = document.getElementById("f-limit-type").value;
      const ae = document.getElementById("f-ae").value;
      const contract = document.getElementById("f-contract").value;
      const q = document.getElementById("f-search").value.trim().toLowerCase();

      const rows = DATA.records.filter((r) => {
        if (from && (!r.trialStartDate || r.trialStartDate < from)) return false;
        if (to && (!r.trialStartDate || r.trialStartDate > to)) return false;
        if (type && r.trialType !== type) return false;
        if (statuses.length && !statuses.includes(r.currentTrialStatus)) return false;
        if (extended && r.trialExtended !== extended) return false;
        if (limitType && r.limitType !== limitType) return false;
        if (ae && r.aeName !== ae) return false;
        if (contract && r.contractCustomer !== contract) return false;
        if (q) {
          const hay = [r.accountName, r.companyName, r.accountUid, r.aeName, r.email, r.opportunityId, r.contractCustomer]
            .join(" ")
            .toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      rows.sort((a, b) => {
        const av = a[sortKey];
        const bv = b[sortKey];
        if (av == null && bv == null) return 0;
        if (av == null) return 1;
        if (bv == null) return -1;
        if (typeof av === "number" && typeof bv === "number") {
          return sortDir === "asc" ? av - bv : bv - av;
        }
        const cmp = String(av).localeCompare(String(bv), undefined, { numeric: true });
        return sortDir === "asc" ? cmp : -cmp;
      });

      filteredCache = rows;
      filterCacheKey = key;
      return rows;
    }

    function summarize(rows) {
      const total = rows.length;
      const ongoing = rows.filter((r) => r.currentTrialStatus === "Ongoing").length;
      const extended = rows.filter((r) => r.trialExtended === "Yes").length;
      const converted = rows.filter((r) => r.convertedToPaid === "Yes");
      const totalMrr = converted.reduce((s, r) => s + (Number(r.mrrGenerated) || 0), 0);
      const avg = (arr) => {
        const v = arr.filter((n) => n != null && Number.isFinite(Number(n))).map(Number);
        if (!v.length) return 0;
        return Math.round((v.reduce((a, b) => a + b, 0) / v.length) * 10) / 10;
      };
      return {
        totalTrialsStarted: total,
        ongoingTrials: ongoing,
        trialsExtended: extended,
        trialsConverted: converted.length,
        trialToPaidConversionRate: total ? Math.round((converted.length / total) * 1000) / 10 : 0,
        totalMrrGenerated: Math.round(totalMrr * 100) / 100,
        avgOriginalTrialDurationDays: avg(rows.map((r) => r.originalTrialDurationDays)),
        avgFinalTrialDurationDays: avg(rows.map((r) => r.currentTotalTrialDurationDays)),
        avgDaysTrialToConversion: avg(converted.map((r) => r.daysTrialToClosedWon)),
      };
    }

    function pageSlice(rows) {
      const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
      if (page > totalPages) page = totalPages;
      if (page < 1) page = 1;
      const start = (page - 1) * pageSize;
      return rows.slice(start, start + pageSize);
    }

    function bindSortOnce(theadId) {
      const thead = document.getElementById(theadId);
      if (thead.dataset.sortBound === "1") return;
      thead.dataset.sortBound = "1";
      thead.addEventListener("click", (event) => {
        const th = event.target.closest("th[data-key]");
        if (!th) return;
        const key = th.getAttribute("data-key");
        if (sortKey === key) sortDir = sortDir === "asc" ? "desc" : "asc";
        else { sortKey = key; sortDir = "desc"; }
        page = 1;
        filteredCache = null;
        renderTables({ kpis: false });
      });
    }

    function paintTable(theadId, tbodyId, columns, rows) {
      const thead = document.getElementById(theadId);
      const tbody = document.getElementById(tbodyId);
      thead.innerHTML = "<tr>" + columns.map((c) => {
        const mark = c.key === sortKey ? (sortDir === "asc" ? "▲" : "▼") : "";
        return `<th data-key="${escapeHtml(c.key)}">${escapeHtml(c.label)}<span class="sort">${mark}</span></th>`;
      }).join("") + "</tr>";
      bindSortOnce(theadId);

      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="${columns.length}" class="muted">No trials match these filters.</td></tr>`;
        return;
      }
      tbody.innerHTML = rows.map((r) =>
        "<tr>" + columns.map((c) => cell(c, r)).join("") + "</tr>"
      ).join("");
    }

    function syncTabVisibility() {
      document.querySelectorAll("[data-main-tab]").forEach((btn) => {
        btn.classList.toggle("active", btn.getAttribute("data-main-tab") === mainTab);
      });
      document.getElementById("panel-summary").classList.toggle("active", mainTab === "summary");
      document.getElementById("panel-detailed").classList.toggle("active", mainTab === "detailed");
      document.querySelectorAll("[data-detail-tab]").forEach((btn) => {
        btn.classList.toggle("active", btn.getAttribute("data-detail-tab") === detailTab);
      });
    }

    function updatePager(total) {
      const totalPages = Math.max(1, Math.ceil(total / pageSize) || 1);
      const start = total ? (page - 1) * pageSize + 1 : 0;
      const end = Math.min(total, page * pageSize);
      document.getElementById("row-count").textContent =
        `${total} of ${DATA.records.length} trials`;
      document.getElementById("page-info").textContent =
        total ? `${start}–${end} · page ${page}/${totalPages}` : "0–0";
      document.getElementById("btn-prev").disabled = page <= 1;
      document.getElementById("btn-next").disabled = page >= totalPages;
    }

    function renderTables({ kpis = true, summary = true, detailed = true } = {}) {
      const rows = filteredRecords();
      if (kpis) renderKpis(summarize(rows));
      const visible = pageSlice(rows);
      updatePager(rows.length);
      syncTabVisibility();
      if (summary) paintTable("thead-summary", "tbody-summary", SUMMARY_COLUMNS, visible);
      if (detailed) {
        paintTable("thead-detailed", "tbody-detailed", activeColumns(), visible);
      }
    }

    const DEFAULT_START_FROM = "2026-01-01";

    function applyDefaultDateFilter() {
      const level = document.getElementById("f-date-level");
      if (level) level.value = "day";
      syncDateLevelInputs();
      document.getElementById("f-start-from").value = DEFAULT_START_FROM;
      document.getElementById("f-start-to").value = "";
    }

    function onFilterChange() {
      page = 1;
      filteredCache = null;
      renderTables();
    }

    function wireFilters() {
      [
        "f-start-from", "f-start-to", "f-type",
        "f-extended", "f-limit-type", "f-ae", "f-contract",
      ].forEach((id) => {
        document.getElementById(id).addEventListener("change", onFilterChange);
      });
      document.getElementById("f-status-toggle").addEventListener("click", (event) => {
        event.stopPropagation();
        const menu = document.getElementById("f-status-menu");
        menu.hidden = !menu.hidden;
      });
      document.addEventListener("click", (event) => {
        const wrap = document.getElementById("f-status");
        if (!wrap.contains(event.target)) {
          document.getElementById("f-status-menu").hidden = true;
        }
      });
      document.getElementById("f-search").addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(onFilterChange, 200);
      });
      document.getElementById("f-date-level").addEventListener("change", () => {
        syncDateLevelInputs();
        if (document.getElementById("f-date-level").value === "day") {
          document.getElementById("f-start-from").value = DEFAULT_START_FROM;
        }
        onFilterChange();
      });
      document.getElementById("btn-reset").addEventListener("click", () => {
        applyDefaultDateFilter();
        document.getElementById("f-type").value = "";
        resetStatusMulti();
        document.getElementById("f-extended").value = "";
        document.getElementById("f-limit-type").value = "";
        document.getElementById("f-ae").value = "";
        document.getElementById("f-contract").value = "";
        document.getElementById("f-search").value = "";
        onFilterChange();
      });
      document.getElementById("btn-refresh").addEventListener("click", () => boot(true));
      document.getElementById("btn-prev").addEventListener("click", () => {
        if (page <= 1) return;
        page -= 1;
        renderTables({ kpis: false });
      });
      document.getElementById("btn-next").addEventListener("click", () => {
        page += 1;
        renderTables({ kpis: false });
      });
      document.getElementById("f-page-size").addEventListener("change", (event) => {
        pageSize = Number(event.target.value) || 100;
        page = 1;
        renderTables({ kpis: false });
      });

      document.querySelectorAll("[data-main-tab]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const next = btn.getAttribute("data-main-tab");
          if (next === mainTab) return;
          mainTab = next;
          syncTabVisibility();
        });
      });
      document.querySelectorAll("[data-detail-tab]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const next = btn.getAttribute("data-detail-tab");
          if (next === detailTab) return;
          detailTab = next;
          const cols = DETAIL_COLUMNS[detailTab] || [];
          if (cols.length && !cols.some((c) => c.key === sortKey)) {
            sortKey = cols[0].key;
            sortDir = "desc";
            page = 1;
            filteredCache = null;
            renderTables({ kpis: false, summary: false });
            return;
          }
          syncTabVisibility();
          renderTables({ kpis: false, summary: false });
        });
      });
    }

    function renderShell() {
      fillSelect("f-type", DATA.filters.trialTypes || []);
      fillStatusMulti(DATA.filters.trialStatuses || []);
      fillSelect("f-ae", DATA.filters.aeNames || []);

      const notes = DATA.fieldNotes || {};
      document.getElementById("field-notes").innerHTML =
        "<ul>" +
        Object.entries(notes).map(([k, v]) =>
          `<li><strong>${escapeHtml(k)}</strong>: ${escapeHtml(v)}</li>`
        ).join("") +
        "</ul>";

      document.getElementById("filters-panel").hidden = false;
      document.getElementById("table-panel").hidden = false;
      applyDefaultDateFilter();
      page = 1;
      filteredCache = null;
      renderTables();
    }

    async function boot(forceRefresh) {
      const status = document.getElementById("status");
      status.hidden = false;
      status.className = "";
      status.textContent = forceRefresh ? "Refreshing…" : "Loading…";
      try {
        const url = forceRefresh ? "/api/data?refresh=1" : "/api/data";
        const res = await fetch(url, { credentials: "same-origin" });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error || `API ${res.status}`);
        }
        DATA = await res.json();
        status.hidden = true;
        status.textContent = "";
        renderShell();
      } catch (err) {
        status.hidden = false;
        status.className = "error";
        status.textContent = String(err.message || err);
      }
    }

    wireFilters();
    boot(false);
  </script>
</body>
</html>
